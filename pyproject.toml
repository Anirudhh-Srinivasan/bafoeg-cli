[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bafoeg-cli"
version = "0.1.0"
description = "BAföG-CLI: Bedarfsrechner, Fristen, Formblätter und offizielle Links"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "smlfg"}]
keywords = ["bafoeg", "cli", "bildung", "foerderung", "studenten"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bafoeg = "bafoeg_cli.cli:main"

[project.urls]
Homepage = "https://github.com/smlfg/bafoeg-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bafoeg_cli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"